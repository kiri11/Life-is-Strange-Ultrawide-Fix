[package]
name = "lis-ultrawide-loader"
description = "Ultrawide camera fix for Life is Strange: Double Exposure and Reunion, applied in memory when the game starts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
name = "lis_ultrawide_loader"
# cdylib is the DLL the game loads; rlib lets the tests call the same code.
crate-type = ["cdylib", "rlib"]

[dependencies]
lis-ultrawide-core = { path = "../core" }

[build-dependencies]
winresource = "0.1"
