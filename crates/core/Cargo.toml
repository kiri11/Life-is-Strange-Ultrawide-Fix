[package]
name = "lis-ultrawide-core"
description = "Everything the Life is Strange ultrawide fix does that is not talking to the operating system"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "lis_ultrawide_core"

# The three digests, pure Rust: blake3's `pure` feature leaves its C and
# assembly back-ends out, so no C compiler is needed on any target.
[dependencies]
blake3 = { version = "1", features = ["pure"] }
sha1 = "0.10"
sha2 = "0.10"
miniz_oxide = "0.8"
