# Builds the fix and, for pushes to main, publishes it as a release. No binary
# is in the repository: a committed binary drifts from the source next to it,
# and nobody can tell by looking. Here the only binaries that exist are the
# ones this file just compiled.
#
# Every push to main cuts its own release and no release is ever overwritten,
# so a build that turns out bad can always be compared against the one before
# it. Put [skip ci] in the commit subject to push without releasing. The
# commit message is the release notes: the subject is the first line and
# the body, if any, follows it, so write the notes for a release in the
# body of the commit (or merge commit) that ships it.
#
# One archive per platform. Windows: the front-end, with the installer (the
# loader embedded) in a cli folder under it. Linux: the static installer.
# Neither carries source or tests: the source is this repository at the
# commit the release names. Nothing in either downloads anything.
name: Build and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Hold the lock from version allocation through both builds and publication.
# PR and manual runs do not publish, so each gets an independent group.
# Queue pushes instead of replacing an older pending release (up to 100).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'release-main' || github.run_id }}
  cancel-in-progress: false
  queue: max

jobs:
  # The Kraken decoder, the container writer and the path search have to
  # behave the same on every platform the fix claims, so the whole workspace
  # is tested on Linux and on Windows. The tests against the game's own
  # files skip themselves where there is no game. The installer built here
  # carries no loader, which is fine for tests and refused at run time.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: cargo test --release --workspace

  build-windows:
    needs: test
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      # The full history, because the version below counts today's tags.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # One version number for the whole fix, written here rather than kept in
      # step by hand: today's date and how many builds today has already had,
      # which is also the release tag. Every binary is stamped with it before
      # it is compiled (LIS_FIX_VERSION for the Rust ones, the assembly
      # attributes for the C#), so the front-end, the installer, the loader
      # and the tag can never disagree about which build they are.
      #
      # The count comes from the tags rather than from GITHUB_RUN_NUMBER, which
      # never resets, so the number stays small and starts each day at 01. It
      # is padded because GitHub orders the releases page by tag name as text,
      # where an unpadded .10 falls under .4 and the newest build stops showing
      # up on top; two digits is more builds in one day than this will ever see.
      - name: Stamp the version
        id: version
        shell: pwsh
        run: |
          $today = Get-Date -Format 'yyyy.MM.dd'
          $count = @(git tag --list "v$today.*").Count
          $version = '{0}.{1:d2}' -f $today, ($count + 1)
          # AssemblyVersion takes bare numbers - no zero padding, no leading zeros
          $numeric = ($version -split '\.' | ForEach-Object { [int]$_ }) -join '.'
          Write-Host "version $version (assembly $numeric)"
          "VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8NoBOM
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8NoBOM

          $cs = Get-Content LiSUltrawidePatcher.cs -Raw
          $cs = $cs -replace 'AssemblyVersion\(".+?"\)', "AssemblyVersion(`"$numeric`")"
          $cs = $cs -replace 'AssemblyFileVersion\(".+?"\)', "AssemblyFileVersion(`"$numeric`")"
          $cs = $cs -replace 'AssemblyInformationalVersion\(".+?"\)', "AssemblyInformationalVersion(`"$version`")"
          Set-Content LiSUltrawidePatcher.cs $cs -NoNewline -Encoding utf8NoBOM
          Select-String -Path LiSUltrawidePatcher.cs -Pattern 'Assembly.*Version\('

      # The loader first, then the installer that embeds it. Rust is on the
      # runner already; the build scripts want the Windows SDK's resource
      # compiler for the version resources, which the runner has too.
      - name: Build the loader and the installer
        shell: pwsh
        env:
          LIS_FIX_VERSION: ${{ env.VERSION }}
        run: |
          cargo build --release -p lis-ultrawide-loader
          if (-not (Test-Path target/release/lis_ultrawide_loader.dll)) { throw 'no loader DLL was built' }
          cargo build --release -p lis-ultrawide-fix
          $banner = & target/release/lis-ultrawide-fix.exe --version
          Write-Host $banner
          if ($banner -notmatch 'embedded') { throw 'the installer was built without the loader' }
          if ($banner -notmatch [regex]::Escape($env:VERSION)) { throw 'the installer does not carry the release version' }
          # The installer has no Cargo dependency on the loader, so it embeds
          # whatever DLL it finds; check it is the one this job just built.
          $loader = (Get-FileHash target/release/lis_ultrawide_loader.dll -Algorithm SHA256).Hash.Substring(0, 16).ToLower()
          if ($banner -notmatch $loader) { throw "the installer embeds a loader other than the one just built (want sha256 $loader)" }
          # crt-static comes from .cargo/config.toml, which a RUSTFLAGS in the
          # environment would silently override: neither binary may import
          # the Visual C++ runtime.
          foreach ($f in 'target/release/lis-ultrawide-fix.exe', 'target/release/lis_ultrawide_loader.dll') {
            $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($f))
            if ($text -match 'VCRUNTIME|MSVCP1|api-ms-win-crt') { throw "$f imports the Visual C++ runtime" }
          }

      # The stock .NET Framework compiler, present on every Windows image and on
      # every Windows the fix targets. No SDK, no csproj, no restore step. Keep
      # this line and the one in LiSUltrawidePatcher.cs's header identical.
      - name: Compile LiSUltrawidePatcher.exe
        shell: cmd
        run: >
          "%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe
          /win32icon:LiSUltrawidePatcher.ico
          /out:LiSUltrawidePatcher.exe LiSUltrawidePatcher.cs
          /r:System.dll /r:System.Windows.Forms.dll /r:System.Drawing.dll

      # What a user needs to run the fix and the file the license needs. The
      # command-line installer sits in a cli folder so that nobody launches
      # it by mistake instead of the window, which looks for it there. The
      # loader is inside the installer, so no loose DLL ships.
      - name: Stage the Windows archive
        shell: pwsh
        run: |
          $root = 'staging/LiS-Ultrawide-Fix-Windows'
          New-Item -ItemType Directory -Path "$root/cli" -Force | Out-Null
          foreach ($f in 'LiSUltrawidePatcher.exe', 'README.md', 'LICENSE') { Copy-Item $f "$root/$f" }
          Copy-Item target/release/lis-ultrawide-fix.exe "$root/cli/lis-ultrawide-fix.exe"
          Compress-Archive -Path $root -DestinationPath 'LiS-Ultrawide-Fix-Windows.zip'
          Get-ChildItem -Recurse $root | Select-Object FullName, Length

      # The loader travels to the Linux job, whose installer embeds the same
      # bytes; the staged folder is available on pull requests too, so a build
      # can be tested before it ships.
      - uses: actions/upload-artifact@v7
        with:
          name: loader-dll
          path: target/release/lis_ultrawide_loader.dll
      - uses: actions/upload-artifact@v7
        with:
          name: LiS-Ultrawide-Fix-Windows
          path: staging/LiS-Ultrawide-Fix-Windows
      - uses: actions/upload-artifact@v7
        with:
          name: windows-zip
          path: LiS-Ultrawide-Fix-Windows.zip

  # A static musl binary, so one file runs on SteamOS, Bazzite, Ubuntu and
  # inside or outside Flatpak Steam. It embeds the loader the Windows job
  # built: the loader is a Windows DLL whatever the installer runs on.
  build-linux:
    needs: build-windows
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build-windows.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: loader-dll
          path: loader
      - name: Build the static installer
        env:
          LIS_FIX_VERSION: ${{ env.VERSION }}
          LIS_LOADER_DLL: ${{ github.workspace }}/loader/lis_ultrawide_loader.dll
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --release -p lis-ultrawide-fix --target x86_64-unknown-linux-musl
          bin=target/x86_64-unknown-linux-musl/release/lis-ultrawide-fix
          file "$bin"
          file "$bin" | grep -Eq 'statically linked|static-pie linked' || { echo 'the installer is not static'; exit 1; }
          if ldd "$bin" 2>/dev/null | grep -q '=>'; then echo 'the installer links shared libraries'; exit 1; fi
          banner=$("$bin" --version)
          echo "$banner"
          echo "$banner" | grep -q embedded || { echo 'the installer was built without the loader'; exit 1; }
          echo "$banner" | grep -qF "$VERSION" || { echo 'the installer does not carry the release version'; exit 1; }
          loader=$(sha256sum "$LIS_LOADER_DLL" | cut -c1-16)
          echo "$banner" | grep -qF "$loader" || { echo "the installer embeds a loader other than the artifact (want sha256 $loader)"; exit 1; }
      # A tarball, so the execute bit survives the trip.
      - name: Stage the Linux archive
        run: |
          root=staging/LiS-Ultrawide-Fix-Linux
          mkdir -p "$root"
          cp target/x86_64-unknown-linux-musl/release/lis-ultrawide-fix "$root/"
          chmod +x "$root/lis-ultrawide-fix"
          cp README.md LICENSE "$root/"
          tar -C staging -czf LiS-Ultrawide-Fix-Linux.tar.gz LiS-Ultrawide-Fix-Linux
          find "$root" -type f | sort | xargs ls -l
      - uses: actions/upload-artifact@v7
        with:
          name: LiS-Ultrawide-Fix-Linux
          path: staging/LiS-Ultrawide-Fix-Linux
      - uses: actions/upload-artifact@v7
        with:
          name: linux-tar
          path: LiS-Ultrawide-Fix-Linux.tar.gz

  # The tag is the version stamped above - date plus today's build number:
  # readable, sorted by GitHub the way it was built, and unique even for two
  # pushes on the same day, so no release ever replaces another, and every
  # binary reports the tag it ships under. The archives keep fixed names,
  # which is what makes the README's /releases/latest/ download links work
  # for every future release.
  release:
    needs: [build-windows, build-linux]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build-windows.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: windows-zip
      - uses: actions/download-artifact@v7
        with:
          name: linux-tar
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          run="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # The whole commit message, minus the trailer block (Signed-off-by
          # and the like) that git keeps at the end of the body.
          subject="$(git log -1 --pretty=%s)"
          body="$(git log -1 --pretty=%b)"
          trailers="$(git log -1 --pretty='%(trailers)')"
          body="$(printf '%s' "${body%"$trailers"}")"
          notes="$subject

          $body

          **Windows:** download LiS-Ultrawide-Fix-Windows.zip, unpack it anywhere and run \`LiSUltrawidePatcher.exe\`.

          **Linux and Steam Deck:** download LiS-Ultrawide-Fix-Linux.tar.gz, unpack it and run \`./lis-ultrawide-fix\` from a terminal (or double-click it in Desktop mode).

          Nothing is downloaded and nothing is installed system-wide. The source is this repository at the commit below.

          Built from \`${{ github.sha }}\` by [this run]($run)."
          # main may have advanced while this run waited; tag the built commit.
          gh release create "$tag" LiS-Ultrawide-Fix-Windows.zip LiS-Ultrawide-Fix-Linux.tar.gz --target "${{ github.sha }}" --title "$tag" --notes "$notes"
